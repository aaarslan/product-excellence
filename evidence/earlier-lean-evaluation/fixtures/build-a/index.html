<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rental quote</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;max-width:32rem;margin:2rem auto;padding:1rem}label,input,button,output{display:block;margin:1rem 0}input,button{font:inherit;max-width:100%;padding:.65rem}input{width:100%}button{min-height:44px}input:focus-visible,button:focus-visible{outline:3px solid #2455b5;outline-offset:3px}#quantity-error{color:#a31818}output{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Rental quote</h1>
<form id="quote-form" novalidate>
<label for="quantity">Equipment units</label>
<input id="quantity" type="number" value="1" min="1" step="1" required aria-describedby="quantity-error">
<p id="quantity-error" aria-live="polite"></p>
<button type="submit">Get quote</button>
</form>
<output id="quote-result" aria-live="polite" aria-atomic="true" aria-busy="false"></output>
</main>
<script src="quote-service.js"></script>
<script src="app.js"></script>
</body>
</html>
